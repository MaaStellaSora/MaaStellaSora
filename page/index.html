    <style>
        /* ===== CSS Variables for Theming ===== */
        :root {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #555555;
            --text-tertiary: #666666;
            --border-color: #c0c8d4;
            --accent-color: #4a90d9;
            --accent-hover: #357abd;
            --star-color: #f0a500;
            --shadow-color: rgba(74, 144, 217, 0.35);
            --shadow-hover: rgba(74, 144, 217, 0.5);
            --mirror-bg: transparent;
            --mirror-hover: rgba(74, 144, 217, 0.06);
            --placeholder-color: #b0b8c4;
            --loading-color: #999999;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #121212;
                --bg-secondary: #1e1e1e;
                --text-primary: #e0e0e0;
                --text-secondary: #aaaaaa;
                --text-tertiary: #bbbbbb;
                --border-color: #333333;
                --accent-color: #6cb4ee;
                --accent-hover: #4a90d9;
                --star-color: #ffd54f;
                --shadow-color: rgba(108, 180, 238, 0.25);
                --shadow-hover: rgba(108, 180, 238, 0.4);
                --mirror-bg: transparent;
                --mirror-hover: rgba(108, 180, 238, 0.1);
                --placeholder-color: #555555;
                --loading-color: #777777;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 4rem;
            gap: 4rem;
        }

        /* ===== Left Panel ===== */
        .left-panel {
            flex: 0 0 auto;
            max-width: 520px;
        }

        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        .app-name-en {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1.15;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }

        .app-name-zh {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.2;
            margin-top: 0.15rem;
            transition: color 0.3s ease;
        }

        .description {
            margin-top: 1.2rem;
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 440px;
            transition: color 0.3s ease;
        }

        .star-count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 1rem;
            font-size: 0.95rem;
            color: var(--text-tertiary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .star-count:hover {
            color: var(--accent-color);
        }

        .star-count svg {
            width: 20px;
            height: 20px;
            fill: var(--star-color);
        }

        .star-number {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.05rem;
            transition: color 0.3s ease;
        }

        /* ===== Buttons ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 1.8rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px var(--shadow-hover);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            transition: all 0.25s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-mirror {
            background: var(--mirror-bg);
            color: var(--accent-color);
            border: 2px dashed var(--accent-color);
            padding: 12px 26px;
            transition: all 0.25s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .btn-mirror:hover {
            background: var(--mirror-hover);
            transform: translateY(-2px);
        }

        .btn-sub {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.85;
        }

        /* ===== Right Panel (Screenshot) ===== */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .screenshot-frame {
            width: 100%;
            max-width: 700px;
            /* Height controlled by JS for smooth easing */
            border: 3px dashed var(--border-color);
            border-radius: 16px;
            background: var(--bg-secondary);
            overflow: hidden;
            position: relative;
            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: height;
        }

        /* Dual-layer image structure for simultaneous crossfade */
        .screenshot-frame img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Fill the frame completely, no scaling up effect */
            border-radius: 13px;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .screenshot-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--placeholder-color);
            font-weight: 600;
            letter-spacing: 4px;
            transition: color 0.3s ease, opacity 0.4s ease;
            z-index: 0;
        }

        /* ===== Loading state ===== */
        .loading-text {
            font-size: 0.8rem;
            color: var(--loading-color);
            margin-left: 4px;
            transition: color 0.3s ease;
        }

        /* ===== Responsive ===== */
        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
                padding: 2rem;
                gap: 2rem;
                overflow-y: auto;
            }

            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }

            .left-panel {
                max-width: 100%;
                text-align: center;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .btn-group {
                justify-content: center;
            }

            .star-count {
                justify-content: center;
            }

            .right-panel {
                width: 100%;
            }

            .screenshot-frame {
                max-width: 600px;
            }
        }

        @media (max-width: 600px) {
            .app-name-en {
                font-size: 1.8rem;
            }

            .app-name-zh {
                font-size: 2rem;
            }

            .btn {
                padding: 12px 20px;
                font-size: 0.85rem;
            }

            .container {
                padding: 1.5rem;
            }
        }
    </style>

<body>
    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <span class="version-badge" id="versionBadge">
                <span class="loading-text">加载中...</span>
            </span>

            <h1 class="app-name-en">MaaStellaSora</h1>
            <h2 class="app-name-zh">星塔助手</h2>

            <p class="description">
                星塔助手（MaaStellaSora）提供对于游戏《星塔旅人》的自动签到、清理日常等功能，由 MaaFramework 强力驱动。

            <a class="star-count" href="https://github.com/MaaStellaSora/MaaStellaSora" target="_blank" rel="noopener">

                </a>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="screenshot-frame" id="screenshotFrame">

                <div class="screenshot-placeholder" id="placeholder">截 图</div>
                <!-- Active image layer -->
                <img id="activeImg" src="" alt="MaaStellaSora 截图" style="opacity: 0; z-index: 1;">
                <!-- Incoming image layer (for crossfade) -->
                <img id="incomingImg" src="" alt="" style="opacity: 0; z-index: 2;">
            </div>
        </div>
    </div>

    <script>
        const REPO = 'MaaStellaSora/MaaStellaSora';
        const GH_PROXY = 'https://gh-proxy.com/';
        const GITHUB_RELEASE_API = `https://api.github.com/repos/${REPO}/releases/latest`;
        const GITHUB_REPO_API = `https://api.github.com/repos/${REPO}`;
        const DEFAULT_PREVIEW = 'preview.png';

        // ===== Screenshot Hover Switching with Simultaneous Crossfade & Size Easing =====
        const screenshotFrame = document.getElementById('screenshotFrame');
        const activeImg = document.getElementById('activeImg');
        const incomingImg = document.getElementById('incomingImg');
        const placeholder = document.getElementById('placeholder');

        const aspectRatioCache = new Map();
        let currentSrc = '';
        let isTransitioning = false;

        /**
         * Get image aspect ratio with caching
         */
        function getImageAspectRatio(src) {
            if (aspectRatioCache.has(src)) return Promise.resolve(aspectRatioCache.get(src));
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const ratio = img.naturalWidth / img.naturalHeight;
                    aspectRatioCache.set(src, ratio);
                    resolve(ratio);
                };
                img.onerror = () => {
                    aspectRatioCache.set(src, 1.6);
                    resolve(1.6);
                };
                img.src = src;
            });
        }

        /**
         * Set frame height based on aspect ratio with CSS transition
         */
        async function setFrameHeightByRatio(src) {
            const ratio = await getImageAspectRatio(src);
            const frameWidth = screenshotFrame.offsetWidth;
            const targetHeight = frameWidth / ratio;
            screenshotFrame.style.height = `${targetHeight}px`;
        }

        /**
         * Switch preview with SIMULTANEOUS crossfade + size easing
         * No waiting for fade-out before starting fade-in
         */
        async function switchPreview(src) {
            if (!src || src === currentSrc || isTransitioning) return;
            isTransitioning = true;

            // Determine which layer is currently visible and which is free
            const outgoing = activeImg.style.opacity === '1' ? activeImg : incomingImg;
            const incoming = activeImg.style.opacity === '1' ? incomingImg : activeImg;

            // Preload incoming image
            const tempImg = new Image();
            tempImg.onload = async () => {
                // Set incoming source and position it behind
                incoming.src = src;
                incoming.style.zIndex = '2';
                outgoing.style.zIndex = '1';

                // Start SIMULTANEOUS crossfade
                incoming.style.opacity = '1';
                outgoing.style.opacity = '0';

                // Adjust frame height concurrently with the crossfade
                await setFrameHeightByRatio(src);

                // Hide placeholder once first real image loads
                placeholder.style.opacity = '0';
                placeholder.style.pointerEvents = 'none';

                currentSrc = src;

                // Allow next transition after CSS transition completes
                setTimeout(() => {
                    isTransitioning = false;
                }, 450);
            };
            tempImg.onerror = () => {
                console.warn(`Preview image not found: ${src}`);
                isTransitioning = false;
            };
            tempImg.src = src;
        }

        /**
         * Initialize default screenshot
         */
        async function initScreenshot() {
            activeImg.src = DEFAULT_PREVIEW;
            activeImg.style.opacity = '1';
            activeImg.style.zIndex = '1';
            currentSrc = DEFAULT_PREVIEW;
            await setFrameHeightByRatio(DEFAULT_PREVIEW);

            // Hide placeholder after default image loads
            activeImg.onload = () => {
                placeholder.style.opacity = '0';
                placeholder.style.pointerEvents = 'none';
            };
        }

        // Bind hover events
        ['btnMFAAvalonia', 'btnMXU'].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const previewSrc = btn.getAttribute('data-preview');
            btn.addEventListener('mouseenter', () => switchPreview(previewSrc));
            btn.addEventListener('mouseleave', () => switchPreview(DEFAULT_PREVIEW));
        });

        // Recalculate on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => setFrameHeightByRatio(currentSrc), 100);
        });

        initScreenshot();

        // ===== Fetch Latest Release & Stars =====
        async function fetchLatestRelease() {
            try {
                const releaseRes = await fetch(GITHUB_RELEASE_API);
                if (!releaseRes.ok) throw new Error('Release API failed');
                const release = await releaseRes.json();

                const repoRes = await fetch(GITHUB_REPO_API);
                if (!repoRes.ok) throw new Error('Repo API failed');
                const repo = await repoRes.json();

                const tagName = release.tag_name;
                const starCount = repo.stargazers_count;

                document.getElementById('versionBadge').textContent = `Latest ${tagName}`;
                document.getElementById('starCount').textContent = starCount.toLocaleString();

                const assets = release.assets || [];
                let mfaUrl = '';
                let mxuUrl = '';

                for (const asset of assets) {
                    const name = asset.name;
                    if (name.includes('win-x86_64') && !name.includes('mxu')) {
                        mfaUrl = asset.browser_download_url;
                    }
                    if (name.includes('mxu-win-amd64')) {
                        mxuUrl = asset.browser_download_url;
                    }
                }

                const baseUrl = `https://github.com/${REPO}/releases/download/${tagName}/`;
                if (!mfaUrl) mfaUrl = `${baseUrl}MaaStellaSora-win-x86_64-${tagName}.zip`;
                if (!mxuUrl) mxuUrl = `${baseUrl}MaaStellaSora-mxu-win-amd64-${tagName}.zip`;

                document.getElementById('btnMFAAvalonia').href = GH_PROXY + mfaUrl;
                document.getElementById('btnMXU').href = GH_PROXY + mxuUrl;
                document.getElementById('btnMirror').href =
                    `https://mirror.ghproxy.com/?q=${encodeURIComponent(mfaUrl)}`;

            } catch (err) {
                console.error('Failed to fetch release info:', err);
                document.getElementById('versionBadge').innerHTML =
                    '<span class="loading-text"> 无法获取最新版本，请前往 GitHub 查看</span>';
                const fallbackBase = `https://github.com/${REPO}/releases/latest`;
                document.getElementById('btnMFAAvalonia').href = fallbackBase;
                document.getElementById('btnMXU').href = fallbackBase;
                document.getElementById('btnMirror').href = fallbackBase;
            }
        }

        fetchLatestRelease();
    </script>
