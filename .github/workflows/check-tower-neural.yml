name: tower-neural-check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-tower-neural.yml"
      - "assets/interface.json"
      - "agent/custom/action/climb_tower_neural/**"
      - "assets/interface/tasks/climb_tower_neural.json"
      - "assets/requirements-win-x64.txt"
      - "assets/resource/**/pipeline/climb_tower/climb_tower_neural*.json"
      - "assets/resource/**/image/ClimbTower_neural/**"
      - "tools/ci/package_common.py"
      - "tools/checks/tower_neural_tests/**"
  pull_request:
    paths:
      - ".github/workflows/check-tower-neural.yml"
      - "assets/interface.json"
      - "agent/custom/action/climb_tower_neural/**"
      - "assets/interface/tasks/climb_tower_neural.json"
      - "assets/requirements-win-x64.txt"
      - "assets/resource/**/pipeline/climb_tower/climb_tower_neural*.json"
      - "assets/resource/**/image/ClimbTower_neural/**"
      - "tools/ci/package_common.py"
      - "tools/checks/tower_neural_tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-neural-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows x64 neural tower tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Resolve MaaFramework release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/resolve_releases.py --maafw-only

      - name: Download MaaFramework
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: MaaXYZ/MaaFramework
          tag: ${{ steps.upstream.outputs.maafw_tag }}
          fileName: ${{ steps.upstream.outputs.maafw_win_x86_64_asset }}
          token: ${{ github.token }}
          out-file-path: "deps"
          extract: true

      - name: Prepare MaaFramework Python wheel
        run: python tools/ci/prepare_maafw.py --maafw-tag "${{ steps.upstream.outputs.maafw_tag }}" --platform-tag win_amd64

      - name: Install neural tower test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --find-links install/deps
          --requirement tools/checks/requirements.txt
          --requirement assets/requirements-win-x64.txt
          "maafw==${{ steps.upstream.outputs.maafw_python_version }}"

      - name: Run neural tower unit tests
        run: python -m unittest discover -s tools/checks/tower_neural_tests -v
