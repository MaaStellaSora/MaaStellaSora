name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false
  release:
    types: [edited]

permissions:
  contents: read

jobs:
  mirrorchyan:
    runs-on: macos-latest
    if: ${{ github.repository_owner == 'MaaStellaSora' }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@f392b50c411981ee6d33c8ed5e91d66d84d56202 # v1
        with:
          mirrorchyan_rid: SSAH
          version_name: ${{ inputs.tag }}

          owner: MaaStellaSora
          repo: MaaStellaSora
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
