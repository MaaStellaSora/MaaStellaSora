# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "zh-CN"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!deps/tools/*.schema.json"
    - "!package-lock.json"
    - "!assets/**/*.png"

  path_instructions:
    - path: "agent/**/*.py"
      instructions: |
        重点检查 MaaFramework 回调和自定义 action/recognition 的生命周期、返回状态、异常路径与空值处理。
        发现可能导致任务卡死、重复执行、误识别或跨区服行为不一致的问题时，给出可复现的执行路径。
        不要仅提出格式化、导入排序或缺少注释等低价值建议。
    - path: "assets/resource/**/pipeline/**/*.json"
      instructions: |
        这是 MaaFramework pipeline 配置。检查节点引用是否存在、跳转和循环能否终止、超时与等待是否合理，
        以及 base/en/jp/tw 等区服资源的行为是否出现非预期分歧。不要建议给 JSON 添加注释。
    - path: "tools/ci/**/*.py"
      instructions: |
        将输入、下载内容和压缩包视为不可信数据。重点检查路径穿越、命令注入、校验缺失、错误被吞掉、
        不可复现依赖和跨 Windows/Linux/macOS 行为差异。
    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        重点检查最小权限、fork PR 的安全边界、表达式注入、secret 暴露、并发发布、Action 是否锁定到提交 SHA，
        以及失败是否会被 `|| true` 等写法意外忽略。

chat:
  auto_reply: true
