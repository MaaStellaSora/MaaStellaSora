name: check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check.yml"
      - "tools/checks/check_resource.py"
      - "tools/checks/requirements.txt"
      - "tools/ci/resolve_releases.py"
      - "tools/ci/prepare_maafw.py"
      - "assets/resource/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "tools/checks/check_resource.py"
      - "tools/checks/requirements.txt"
      - "tools/ci/resolve_releases.py"
      - "tools/ci/prepare_maafw.py"
      - "assets/resource/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resource:
    name: Resource checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Resolve MaaFramework release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/resolve_releases.py --maafw-only

      - name: Download MaaFramework
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: MaaXYZ/MaaFramework
          tag: ${{ steps.upstream.outputs.maafw_tag }}
          fileName: ${{ steps.upstream.outputs.maafw_macos_aarch64_asset }}
          token: ${{ github.token }}
          out-file-path: "deps"
          extract: true

      - name: Install resource checker dependencies
        run: |
          python tools/ci/prepare_maafw.py --maafw-tag "${{ steps.upstream.outputs.maafw_tag }}" --platform-tag macosx_13_0_arm64
          python -m pip install --disable-pip-version-check --find-links install/deps --requirement tools/checks/requirements.txt "maafw==${{ steps.upstream.outputs.maafw_python_version }}"

      - name: Check Resource (BASE)
        run: |
          python ./tools/checks/check_resource.py ./assets/resource/base/

      - name: Check Resource (TW)
        run: |
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/tw/

      - name: Check Resource (EN)
        run: |
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/en/

      - name: Check Resource (JP)
        run: |
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/jp/

      - name: Check desktop resource overlays
        run: |
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/windows/
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/tw/ ./assets/resource/windows/
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/en/ ./assets/resource/windows/
          python ./tools/checks/check_resource.py ./assets/resource/base/ ./assets/resource/jp/ ./assets/resource/windows/
